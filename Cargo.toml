[package]
name = "mi-clip"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
default = ["ui"]
ui = [
    "dep:gpui-rhai",
    "dep:async-channel",
    "clipboard",
    "file-sharing",
    "analytics",
    "desktop-tray",
]
# Native tray/notification/单实例 backends. Target-scoped dependencies are only
# built for the platform that provides them.
desktop-tray = ["dep:block2", "dep:ksni", "dep:zbus", "dep:resvg", "dep:notify-rust"]
analytics = ["dep:posthog-rs", "dep:uuid"]
clipboard = [
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:wl-clipboard-rs",
    "dep:wayland-client",
    "dep:rustix",
]
file-sharing = ["clipboard", "dep:kcp"]
research = ["file-sharing", "dep:notify-rust"]

[[bin]]
name = "mi-clip"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "mi-clip-auth"
path = "src/bin/auth.rs"
required-features = ["research"]

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22"
p256 = { version = "0.13.2", default-features = false, features = ["std", "ecdsa", "pkcs8", "ecdh"] }
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
qrcode = { version = "0.14", default-features = false }
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }

gpui-rhai = { version = "=0.2.2", default-features = false, optional = true }
async-channel = { version = "2.5", optional = true }
anyhow = "1"
x509-cert = { version = "0.2.5", features = ["pem"] }
kcp = { version = "=0.6.0", optional = true }
posthog-rs = { version = "0.27", default-features = false, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
libc = "=0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSObject", "NSString", "NSData", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSImage", "NSButton", "NSControl", "NSView", "NSResponder", "NSWindow", "NSScreen", "NSRunningApplication", "NSEvent", "NSGraphicsContext", "NSWorkspace", "NSAccessibility", "block2"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0

[profile.dev.package.rhai]
opt-level = 1

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { optional = true, version = "=0.3.7", default-features = false, features = ["blocking", "async-io"] }
mdns-sd = { version = "=0.21.6", default-features = false }
notify-rust = { optional = true, version = "=4.18.2", default-features = false, features = ["z"] }
resvg = { optional = true, version = "=0.45.1", default-features = false }
rustix = { optional = true, version = "=1.1.5", features = ["event", "fs"] }
wayland-client = { optional = true, version = "=0.31.15" }
wl-clipboard-rs = { optional = true, version = "=0.9.4", default-features = false }
zbus = { optional = true, version = "=5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
